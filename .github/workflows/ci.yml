name: CI mit Devcontainer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  devcontainer-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare target directory for test results
        run: |
          mkdir -p target/nextest/ci
          mkdir -p .cargo_cache
          chmod -R 777 target .cargo_cache

      - name: Activate Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target/nextest-ci
          shared-key: "devcontainer-cargo-cache"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test Devcontainer
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          skipContainerUserIdUpdate: true
          push: never
          runCmd: cargo nextest run --profile ci

      - name: Run security audit
        if: success() || failure()
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          skipContainerUserIdUpdate: true
          push: never
          runCmd: cargo audit --format json > target/audit-report.json
